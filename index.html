<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta content='width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no' name='viewport'/>
  <title>CIS Protocol - Admin Manual Book</title>
  
  <link href='https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css' rel='stylesheet'/>
  <link href='https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800;900&family=Orbitron:wght@500;700;900&display=swap' rel='stylesheet'/>

  <style>
    /* ==================================================================
       GLOBAL STYLES & CYBERPUNK THEME
    ================================================================== */
    :root {
      --cyan: #38bdf8;
      --gold: #f59e0b;
      --green: #10b981;
      --red: #ef4444;
      --purple: #a855f7;
      --dark-bg: #0f172a;
      --panel-bg: #1e293b;
      --border-color: #334155;
      --text-main: #e2e8f0;
      --text-muted: #94a3b8;
    }

    body { margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; background: var(--dark-bg); color: var(--text-main); line-height: 1.6; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
    * { box-sizing: border-box; outline: none; }
    a { text-decoration: none; }

    @keyframes pulseGlow { 0% { box-shadow: 0 0 10px rgba(56,189,248,0.3); } 50% { box-shadow: 0 0 25px rgba(56,189,248,0.7); } 100% { box-shadow: 0 0 10px rgba(56,189,248,0.3); } }
    @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-10px); } 100% { transform: translateY(0px); } }
    @keyframes slideInUp { from { transform: translateY(50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

    /* ==================================================================
       HERO SECTION 
    ================================================================== */
    .hero { 
      background: radial-gradient(circle at center top, #1e293b, #0f172a);
      border-bottom: 2px solid var(--cyan);
      padding: 50px 20px 40px 20px; text-align: center; position: relative; overflow: hidden;
    }
    .hero-content { position: relative; z-index: 2; max-width: 800px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; gap: 15px; }
    
    .logo-container {
      width: 100px; height: 100px; border-radius: 50%; background: #fff; padding: 4px;
      border: 3px solid var(--cyan); animation: pulseGlow 3s infinite, float 4s ease-in-out infinite;
      display: flex; align-items: center; justify-content: center;
    }
    .logo-container i { font-size: 3rem; color: var(--cyan); }
    
    .hero h1 { font-family: 'Orbitron', sans-serif; font-size: 2rem; font-weight: 900; color: #fff; margin: 0; letter-spacing: 2px; text-shadow: 0 0 15px rgba(56,189,248,0.5); text-transform: uppercase;}
    .hero p { color: var(--text-muted); font-size: 1rem; margin: 5px 0 0 0; }
    .badge-master { background: rgba(56,189,248,0.1); border: 1px dashed var(--cyan); color: var(--cyan); padding: 5px 15px; border-radius: 8px; font-size: 0.75rem; font-weight: 800; font-family: 'Orbitron'; letter-spacing: 1px; }

    /* ==================================================================
       MAIN MENU (GRID STYLE)
    ================================================================== */
    .container { max-width: 1000px; margin: 0 auto; padding: 30px 20px; }
    .section-title { text-align: center; font-family: 'Orbitron'; color: var(--cyan); margin-bottom: 25px; font-size: 1.2rem; letter-spacing: 1px; text-transform: uppercase; }

    .grid-menu { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; }
    
    .menu-card { 
      background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 15px; padding: 25px 20px; 
      display: flex; flex-direction: column; align-items: center; text-align: center; cursor: pointer; transition: 0.3s;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3); position: relative; overflow: hidden;
    }
    .menu-card::before { content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; background: var(--cyan); transition: 0.3s; }
    .menu-card:hover { transform: translateY(-5px); border-color: #475569; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    .menu-card:hover::before { width: 100%; opacity: 0.1; }
    
    .menu-icon { font-size: 2.5rem; margin-bottom: 15px; filter: drop-shadow(0 0 10px rgba(255,255,255,0.2)); }
    .menu-card h3 { margin: 0 0 8px 0; font-family: 'Orbitron'; font-size: 1rem; color: #fff; letter-spacing: 0.5px; text-transform: uppercase; }
    .menu-card p { margin: 0; font-size: 0.8rem; color: var(--text-muted); line-height: 1.5; }

    /* Specific Colors */
    .mc-1::before { background: var(--cyan); } .mc-1 .menu-icon { color: var(--cyan); }
    .mc-2::before { background: var(--gold); } .mc-2 .menu-icon { color: var(--gold); }
    .mc-3::before { background: var(--green); } .mc-3 .menu-icon { color: var(--green); }
    .mc-4::before { background: var(--purple); } .mc-4 .menu-icon { color: var(--purple); }
    .mc-5::before { background: var(--red); } .mc-5 .menu-icon { color: var(--red); }
    .mc-6::before { background: #3498db; } .mc-6 .menu-icon { color: #3498db; }

    /* ==================================================================
       FULLSCREEN MODAL (POPUP LAYAR)
    ================================================================== */
    .modal-overlay { 
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
      background: rgba(11, 15, 25, 0.95); z-index: 9999; display: none; 
      flex-direction: column; overflow-y: auto; backdrop-filter: blur(8px);
    }
    
    .modal-header {
      background: #0f172a; padding: 20px; border-bottom: 2px solid var(--cyan); 
      display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 10;
      box-shadow: 0 5px 20px rgba(0,0,0,0.5);
    }
    .modal-header h2 { margin: 0; font-family: 'Orbitron'; font-size: 1.2rem; color: #fff; display: flex; align-items: center; gap: 10px; }
    
    .btn-close { 
      background: rgba(239, 68, 68, 0.1); border: 1px solid var(--red); color: var(--red); 
      width: 40px; height: 40px; border-radius: 50%; font-size: 1.2rem; display: flex; align-items: center; justify-content: center; 
      cursor: pointer; transition: 0.2s; 
    }
    .btn-close:hover { background: var(--red); color: #fff; transform: rotate(90deg); }
    
    .modal-body { padding: 30px 20px; max-width: 800px; margin: 0 auto; width: 100%; animation: slideInUp 0.4s ease-out; }
    
    /* ==================================================================
       TYPOGRAPHY & COMPONENTS IN MODAL
    ================================================================== */
    .modal-body h4 { color: var(--cyan); font-family: 'Orbitron'; font-size: 1.1rem; border-bottom: 1px dashed var(--border-color); padding-bottom: 10px; margin-top: 30px; }
    .modal-body h4:first-child { margin-top: 0; }
    .modal-body p { color: #cbd5e1; font-size: 0.95rem; line-height: 1.7; margin-bottom: 15px; }
    
    .highlight-box { background: linear-gradient(135deg, rgba(56,189,248,0.05), rgba(0,0,0,0)); border-left: 4px solid var(--cyan); padding: 20px; margin: 20px 0; border-radius: 0 12px 12px 0; border: 1px solid var(--border-color); }
